apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-common-config
  namespace: newshop
data:
  DB_HOST: "mysql.newshop.svc.cluster.local"
  DB_PORT: "3306"
  REDIS_HOST: "redis.newshop.svc.cluster.local"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.newshop.svc.cluster.local:9092"
  USER_SERVICE_URL: "http://user-service:8081"
  PRODUCT_SERVICE_URL: "http://product-service:8082"
  ORDER_SERVICE_URL: "http://order-service:8083"
  PAYMENT_SERVICE_URL: "http://payment-service:8084"
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
  namespace: newshop
type: Opaque
stringData:
  DB_USER: "shopuser"
  DB_PASSWORD: "shoppassword"
  JWT_SECRET: "shopSuperSecretKeyForJwtSigningMustBeVeryLong32Chars!"
