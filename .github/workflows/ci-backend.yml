name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  test-and-build:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew 2>/dev/null || true

      - name: Build with Gradle & Run Tests
        working-directory: ./backend
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew test --no-daemon
          else
            echo "Gradle wrapper check"
          fi

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      # 실무 환경: 변경된 서비스에 대해서만 Docker 이미지 빌드 및 레지스트리 푸시
      - name: Build Docker Images (Main Branch)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Building microservice docker images..."
          # docker build -t newshop/api-gateway:latest ./backend/api-gateway
          # docker build -t newshop/user-service:latest ./backend/user-service
          # docker build -t newshop/product-service:latest ./backend/product-service
          # docker build -t newshop/order-service:latest ./backend/order-service
          # docker build -t newshop/payment-service:latest ./backend/payment-service
